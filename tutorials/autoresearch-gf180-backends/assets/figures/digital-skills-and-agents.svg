    <text x="32" y="142" font-family="Ubuntu Mono, monospace" font-size="14" letter-spacing="0.14em" fill="#6B5BD9">DIGITAL.* · SUB-AGENT PERSONAS  ·  used by ProjectManager (master)</text>

