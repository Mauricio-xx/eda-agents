      <text x="370" y="30" text-anchor="middle" font-family="Ubuntu Mono, monospace" font-size="14" fill="#CF5044">gf180-idea-to-chip</text>

      <line x1="492" y1="24" x2="536" y2="24" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#arrFlow)"/>

      <rect x="540" y="0" width="312" height="48" rx="8" fill="#FFFFFF" stroke="#E6E4DC" stroke-width="1.2"/>
      <text x="696" y="30" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="15" fill="#1A1A1A">idea_loop  OR  autoresearch</text>

      <line x1="852" y1="24" x2="896" y2="24" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#arrFlow)"/>

      <rect x="900" y="0" width="288" height="48" rx="8" fill="#F5F8FE" stroke="#4A7BD9" stroke-width="1.2"/>
      <text x="1044" y="30" text-anchor="middle" font-family="Ubuntu Mono, monospace" font-size="13" fill="#1A1A1A">docker-digital + skills</text>

      <line x1="1188" y1="24" x2="1232" y2="24" stroke="#1A1A1A" stroke-width="1.6" marker-end="url(#arrFlow)"/>

      <rect x="1236" y="0" width="204" height="48" rx="8" fill="#FFFFFF" stroke="#E6E4DC" stroke-width="1.2"/>
      <text x="1338" y="30" text-anchor="middle" font-family="Ubuntu, sans-serif" font-size="15" fill="#1A1A1A">phase_idea/, phase_optimize/</text>
