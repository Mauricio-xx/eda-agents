      <text x="20" y="25" font-family="Ubuntu Mono, monospace" font-size="14" fill="#1A1A1A">verification</text>
    </g>
    <g transform="translate(548, 156)">
      <rect x="0" y="0" width="240" height="40" rx="6" fill="#F5F4FE" stroke="#6B5BD9" stroke-width="1"/>
      <text x="20" y="25" font-family="Ubuntu Mono, monospace" font-size="14" fill="#1A1A1A">synthesis</text>
