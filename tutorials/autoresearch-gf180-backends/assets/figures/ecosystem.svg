<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Ubuntu, 'Ubuntu Sans', sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#FAFAF7"/>

  <defs>
    <marker id="arrInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrM3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7BD9"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5CD0B3"/>
    </marker>
    <marker id="arrPoly" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FC6255"/>
    </marker>
  </defs>

  <!-- Eyebrow -->
  <text x="80" y="80" font-family="Ubuntu Mono, monospace" font-size="22" letter-spacing="0.16em"
        fill="#6B6358">ECOSYSTEM · THREE WAYS TO DRIVE EDA-AGENTS · MANUAL TO FULLY AGENTIC</text>
  <line x1="80" y1="100" x2="1520" y2="100" stroke="#E6E4DC" stroke-width="1"/>

  <!-- ============== Top: eda-agents library ============== -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="520" height="90" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.6"/>
    <text x="32" y="32" font-family="Ubuntu Mono, monospace" font-size="14" letter-spacing="0.14em" fill="#6B6358">PYTHON LIBRARY</text>
    <text x="32" y="68" font-family="Ubuntu, sans-serif" font-size="32" font-weight="600" fill="#1A1A1A">eda-agents</text>
  </g>

  <!-- Three fanout arrows -->
  <line x1="800" y1="220" x2="310" y2="290" stroke="#4A7BD9" stroke-width="2.4" marker-end="url(#arrM3)"/>
  <line x1="800" y1="220" x2="800" y2="290" stroke="#5CD0B3" stroke-width="2.4" marker-end="url(#arrTeal)"/>
  <line x1="800" y1="220" x2="1290" y2="290" stroke="#FC6255" stroke-width="2.4" marker-end="url(#arrPoly)"/>

  <!-- ============== Lane 1: MANUAL / LIBRARY (m3-blue) ============== -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="460" height="420" rx="12" fill="#FFFFFF" stroke="#E6E4DC" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="420" fill="#4A7BD9"/>
    <text x="32" y="42" font-family="Ubuntu Mono, monospace" font-size="14" letter-spacing="0.16em" fill="#3F65B5">LANE 1 · MANUAL / LIBRARY</text>
    <text x="32" y="92" font-family="Ubuntu, sans-serif" font-size="32" font-weight="600" fill="#1A1A1A">You write Python.</text>
    <text x="32" y="122" font-family="Ubuntu, sans-serif" font-style="italic" font-size="20" fill="#6B6358">No LLM in the loop.</text>
    <line x1="32" y1="148" x2="428" y2="148" stroke="#E6E4DC"/>

    <text x="32" y="184" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#3F65B5">DRIVER</text>
    <text x="32" y="208" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">Your Python script imports runners</text>
    <text x="32" y="228" font-family="Ubuntu Mono, monospace" font-size="14" fill="#6B6358">from eda_agents.core import LibreLaneRunner</text>

    <text x="32" y="268" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#3F65B5">USES</text>
    <text x="32" y="292" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">Runners only:</text>
    <text x="32" y="312" font-family="Ubuntu, sans-serif" font-size="16" fill="#6B6358">LibreLane · cocotb · KLayout DRC/LVS</text>

    <text x="32" y="350" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#3F65B5">BEST FOR</text>
    <text x="32" y="374" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">CI · regression sweeps · fixed-config runs</text>
    <text x="32" y="398" font-family="Ubuntu, sans-serif" font-style="italic" font-size="15" fill="#6B6358">when you already know the knob settings</text>
  </g>

  <!-- ============== Lane 2: SINGLE-SHOT AGENTIC (hi-teal) ============== -->
  <g transform="translate(570, 300)">
    <rect x="0" y="0" width="460" height="420" rx="12" fill="#FFFFFF" stroke="#E6E4DC" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="420" fill="#5CD0B3"/>
    <text x="32" y="42" font-family="Ubuntu Mono, monospace" font-size="14" letter-spacing="0.16em" fill="#3D9C84">LANE 2 · SINGLE-SHOT AGENTIC</text>
    <text x="32" y="92" font-family="Ubuntu, sans-serif" font-size="32" font-weight="600" fill="#1A1A1A">Specialist agent</text>
    <text x="32" y="122" font-family="Ubuntu, sans-serif" font-style="italic" font-size="20" fill="#6B6358">LLM decides; you supervise.</text>
    <line x1="32" y1="148" x2="428" y2="148" stroke="#E6E4DC"/>

    <text x="32" y="184" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#3D9C84">DRIVER</text>
    <text x="32" y="208" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">Invoke an agent in cc / opencode CLI</text>
    <text x="32" y="228" font-family="Ubuntu Mono, monospace" font-size="14" fill="#6B6358">gf180-idea-to-chip · gf180-docker-digital</text>

    <text x="32" y="268" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#3D9C84">USES</text>
    <text x="32" y="292" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">Skills + Runners:</text>
    <text x="32" y="312" font-family="Ubuntu, sans-serif" font-size="16" fill="#6B6358">digital.* · flow.* skills, then runners</text>

    <text x="32" y="350" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#3D9C84">BEST FOR</text>
    <text x="32" y="374" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">First design pass · one-off hardening</text>
    <text x="32" y="398" font-family="Ubuntu, sans-serif" font-style="italic" font-size="15" fill="#6B6358">when you want the agent to draft + close</text>
  </g>

  <!-- ============== Lane 3: AUTORESEARCH (poly-red) ============== -->
  <g transform="translate(1060, 300)">
    <rect x="0" y="0" width="460" height="420" rx="12" fill="#FFFFFF" stroke="#FC6255" stroke-width="2.2"/>
    <rect x="0" y="0" width="6" height="420" fill="#FC6255"/>
    <text x="32" y="42" font-family="Ubuntu Mono, monospace" font-size="14" letter-spacing="0.16em" fill="#CF5044">LANE 3 · AUTORESEARCH</text>
    <text x="32" y="92" font-family="Ubuntu, sans-serif" font-size="32" font-weight="600" fill="#1A1A1A">Greedy loop</text>
    <text x="32" y="122" font-family="Ubuntu, sans-serif" font-style="italic" font-size="20" fill="#6B6358">LLM iterates over FoM.</text>
    <line x1="32" y1="148" x2="428" y2="148" stroke="#E6E4DC"/>

    <text x="32" y="184" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#CF5044">DRIVER</text>
    <text x="32" y="208" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">DigitalAutoresearchRunner</text>
    <text x="32" y="228" font-family="Ubuntu Mono, monospace" font-size="14" fill="#6B6358">--backend cc_cli  |  --backend opencode</text>

    <text x="32" y="268" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#CF5044">USES</text>
    <text x="32" y="292" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">Harness + Skills + Runners</text>
    <text x="32" y="312" font-family="Ubuntu, sans-serif" font-size="16" fill="#6B6358">+ program.md memory + results.tsv log</text>

    <text x="32" y="350" font-family="Ubuntu Mono, monospace" font-size="13" letter-spacing="0.14em" fill="#CF5044">BEST FOR</text>
    <text x="32" y="374" font-family="Ubuntu, sans-serif" font-size="18" fill="#1A1A1A">QoR exploration over flow knobs / RTL</text>
    <text x="32" y="398" font-family="Ubuntu, sans-serif" font-style="italic" font-size="15" fill="#6B6358">when you do not know the optimum yet</text>
  </g>

  <!-- ============== Bottom contract bar ============== -->
  <g transform="translate(80, 760)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#E6E4DC"/>
    <text x="0" y="36" font-family="Ubuntu Mono, monospace" font-size="16" letter-spacing="0.16em" fill="#6B6358">SHARED CONTRACT  ·  SAME PROJECT, DIFFERENT AUTOMATION LEVEL</text>
    <text x="0" y="68" font-family="Ubuntu, sans-serif" font-size="20" font-style="italic" fill="#1A1A1A">DigitalDesign + TestbenchSpec across all three modes. Skills, agents and topologies are user-extensible — new
            domains welcome (analog is a sibling track in active development).</text>
  </g>
</svg>
